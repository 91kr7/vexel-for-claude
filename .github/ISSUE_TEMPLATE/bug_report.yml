name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: How do you run it?
      options: [Desktop window (npm run desktop), Browser (npm start), Dev server (npm run dev)]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Vexel version or commit
      placeholder: v0.1.0 or a commit hash
  - type: input
    id: env
    attributes:
      label: Linux distribution, Node.js and Claude Code versions
      placeholder: Ubuntu 24.04, Node 22.23, claude 2.1.x
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove anything private first, terminals can contain secrets.

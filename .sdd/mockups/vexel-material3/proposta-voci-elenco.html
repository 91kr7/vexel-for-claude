<style>
body{margin:0}
a{color:#5847B8}a:hover{color:#3F2C9E}
.m3{--primary:#5847B8;--primary-container:#E4DFFF;--on-primary-container:#3F2C9E;--secondary-container:#E4DFF9;--on-secondary-container:#47435A;--teal-container:#C8EBE6;--on-teal-container:#1F4D48;--attn:#7C5800;--attn-container:#FFDEA7;--on-attn-container:#5E4200;--ember:#E07A4F;--surface:#FDF8FF;--on-surface:#1C1B21;--on-surface-variant:#47464F;--outline:#787680;--outline-variant:#C8C5D0;--sc-lowest:#FFFFFF;--sc-low:#F7F2FA;--sc-highest:#E5E1E9}
.m3.dark{--primary:#C6BFFF;--primary-container:#3F2C9E;--on-primary-container:#E4DFFF;--secondary-container:#47435A;--on-secondary-container:#E4DFF9;--teal-container:#1F4D48;--on-teal-container:#C8EBE6;--attn:#F0BF48;--attn-container:#5E4200;--on-attn-container:#FFDEA7;--ember:#F09A72;--surface:#141318;--on-surface:#E5E1E9;--on-surface-variant:#C8C5D0;--outline:#928F9A;--outline-variant:#47464F;--sc-lowest:#0F0E13;--sc-low:#1C1B21;--sc-highest:#36343A}
.m3{font-family:'Roboto Flex',system-ui,sans-serif;color:var(--on-surface);background:var(--surface)}
.m3 button{font-family:inherit}
.brand{font-variation-settings:'wdth' 125,'GRAD' 50;font-weight:800;letter-spacing:-.5px}
.icon{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.label-l{font-size:14px;line-height:20px;font-weight:500;letter-spacing:.1px}
.label-m{font-size:12px;line-height:16px;font-weight:500;letter-spacing:.5px}
.body-m{font-size:14px;line-height:20px;letter-spacing:.25px}
.body-s{font-size:12px;line-height:16px;letter-spacing:.4px}
.title-m{font-size:16px;line-height:24px;font-weight:500;letter-spacing:.15px}
</style>
</helmet>
<div style="width: 1440px; height: 820px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr))">
  <sc-for list="{{columns}}" as="col" hint-placeholder-count="2">
    <section class="{{col.cls}}" aria-label="{{col.name}}" style="display: flex; flex-direction: column; gap: 16px; padding: 40px 56px; box-sizing: border-box">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <div style="display: flex; align-items: center; gap: 12px">
          <svg sc-camel-view-box="0 0 29 23" role="img" aria-label="Vexel" style="width: 30px; height: 24px">
            <rect x="0" y="0" width="5" height="5" rx="1.5" fill="var(--primary)"></rect><rect x="24" y="0" width="5" height="5" rx="1.5" fill="var(--primary)"></rect>
            <rect x="0" y="6" width="5" height="5" rx="1.5" fill="var(--primary)"></rect><rect x="24" y="6" width="5" height="5" rx="1.5" fill="var(--primary)"></rect>
            <rect x="6" y="12" width="5" height="5" rx="1.5" fill="var(--primary)"></rect><rect x="18" y="12" width="5" height="5" rx="1.5" fill="var(--primary)"></rect>
            <rect x="12" y="18" width="5" height="5" rx="1.5" fill="var(--ember)"></rect>
          </svg>
          <span class="brand" style="font-size: 24px; line-height: 30px; color: var(--primary)">Vexel</span>
          <span class="label-l" style="color: var(--on-surface-variant)">for Claude</span>
        </div>
        <span class="label-l" style="color: var(--on-surface-variant)">{{col.name}}</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 12px; border-radius: 28px; background: var(--sc-low)">
        <sc-for list="{{items}}" as="item" hint-placeholder-count="5">
          <button type="button" style="{{item.rowStyle}}">
            <span class="label-l" style="{{item.avatarStyle}}">{{item.mono}}</span>
            <span style="min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 6px">
              <span style="display: flex; flex-direction: column">
                <span style="display: flex; align-items: center; gap: 8px">
                  <span class="title-m">{{item.title}}</span>
                  <sc-if value="{{item.external}}" hint-placeholder-val="{{false}}">
                    <span class="label-m" style="display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 6px; border-radius: 6px; border: 1px solid var(--outline); color: var(--on-surface-variant)"><svg class="icon" sc-camel-view-box="0 0 24 24" aria-hidden="true" style="width: 12px; height: 12px"><path d="m4 17 6-6-6-6M12 19h8"></path></svg>Esterna</span>
                  </sc-if>
                </span>
                <span class="body-m" style="{{item.subStyle}}">{{item.sub}}</span>
              </span>
              <sc-if value="{{item.working}}" hint-placeholder-val="{{false}}">
                <span aria-hidden="true" style="display: block; height: 4px; border-radius: 2px; background: var(--primary-container); overflow: hidden"><span style="display: block; width: 45%; height: 4px; border-radius: 2px; background: var(--primary)"></span></span>
              </sc-if>
            </span>
            <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: none">
              <span class="label-m" style="{{item.stateStyle}}"><svg class="icon" sc-camel-view-box="0 0 24 24" aria-hidden="true" style="width: 14px; height: 14px"><path d="{{item.iconPath}}"></path></svg>{{item.state}}</span>
              <span class="body-s" style="color: var(--on-surface-variant)">{{item.time}}</span>
            </span>
          </button>
        </sc-for>
      </div>
    </section>
  </sc-for>
</div>
</x-dc>
